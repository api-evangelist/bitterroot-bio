name: Bitterroot Bio
description: 'Bitterroot Bio is a privately held, clinical-stage biotechnology company based in Palo
  Alto, California, pioneering the emerging field of cardio-immunology — the interplay between the immune
  system and cardiovascular disease. Its lead program, BRB-002, is a novel investigational immunomodulating
  protein therapy that targets CD47 to treat atherosclerotic cardiovascular disease (ASCVD) by acting on
  atherosclerotic plaque through the immunomodulation of macrophages, an approach distinct from current
  standards of care. Founded in 2021, the company is advancing BRB-002 through its MATADOR Phase 2a proof-of-concept
  study. Bitterroot Bio is a therapeutics developer and publishes no public developer API or programmatic
  surface; this profile captures its public web identity within the API Evangelist network.'
